# Make sure you're using the correct MATERIAL name for your server's version : https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html

# You're able to use placeholders for names that are not fully capitalized. To use, just add a "_l" behind placeholders, e.g, %companion_l%, %active_companion_l%.

settings:
  # Check if the plugin is up to date.
  versionChecking: true
  # Set the keyword to cancel chat actions like changing weapons/name.
  cancelKeyWord: "cancel"
  # Plays an action bar of the Companion's name when it's equipped.
  actionBarMessage: true
  # Set what's the max upgradable ability level - It's advisable to put a level lower than 5.
  maxAbilityLevel: 3
  # Set the max name length a player can set to.
  maxNameLength: 10
  abilityMaxedOutItem: GUNPOWDER
  # The range determines how far other players are able to see someone's Companion at. Change at your own risk, a higher range might result in more resourced used.
  packetSearchRange: 10, 10, 10
  # companionTalk is removed temporarily (hopefully).
  companionTalk:
    - "<gray>Heh. That tickles!"
    - "<gray>Get your hands away from me!"
    - "<gray>What?"
    - "<gray>Yes?"
    - "<gray>Knock, knock! .. Who's there?"
    - "<gray>What am I?"
    - "<gray>... Where am I?"
  # interactCooldown is counted by seconds.    
  interactCooldown: 3
  # Set how frequent should the plugin save its necessary files.(in minutes)
  saveTime: 60
  vanish:
    perms: essentials.vanish
    commands: /v, /vanish
  
  # Set which names that you don't want players' companions having. 
  # companions.admin.blacklist - allows you to override the blacklist system using this permission node.
  blacklistedNames:
    - "dick"
    - "fuck"
  # Set which worlds you do not want Companions to be used in.  
  disabledWorlds:
    - world1
    - world2
  # Set which line to not show in the owned Companion ItemStacks
  # La boutique n'existe plus : aucune ligne d'achat a masquer.
  replacedOwnedLores: []
  
  # true: Kick player if cache is not loaded for them properly. (To ensure all Companions Data are loaded for the player)
  ensureCache: true
    
database:
  use: false
  hostname: localhost
  port: 3306
  username: "root"
  password: ""
  databaseName: "companions"
  tablePrefix: "companions_"
    
items:
  companionToken:
    name: "<gold><b>COMPANION TOKEN</b>"
    type: GHAST_TEAR
    description: 
      - ""
      - "<gold><b>RIGHT CLICK </b><gray>on a block"
      - " to redeem your mystery Companion!"
    particleAnimation: EXPLOSION_LARGE
    soundOnUse: BLOCK_BEACON_POWER_SELECT
    
GUI:
  # Charte Nuit d'acier.
  # Regle : les TITRES et les NOMS d'objets cliquables sont compares tels quels par le
  # plugin pour reconnaitre un clic. Ils restent donc en une seule couleur, sans degrade.

  # Cadre des menus : vitres du pourtour, vitres des coins, bouton Fermer.
  decor:
    border: GRAY_STAINED_GLASS_PANE
    corner: LIGHT_BLUE_STAINED_GLASS_PANE
    close:
      type: BARRIER
      name: "<!italic><#ff8a8a><b>Fermer</b>"
      slot: 49

  # Les fleches n'apparaissent que lorsqu'il existe une page precedente ou suivante.
  goBack:
    type: SPECTRAL_ARROW
    amount: 1
    name: "<!italic><#5fd3ff><b>Page précédente</b>"
    slot: 45
    description: []
  nextPage:
    type: ARROW
    amount: 1
    name: "<!italic><#5fd3ff><b>Page suivante</b>"
    slot: 53
    description: []

  # INUTILISE : menu d'accueil supprime du plugin. Cles conservees car lues au demarrage.
  open-companions:
    title: "<!italic><#1f3a52><b>Inutilisé</b>"
    size: 9
    openSound: BLOCK_AMETHYST_BLOCK_CHIME
    items:
      companion-shop:
        type: PUFFERFISH_SPAWN_EGG
        amount: 1
        name: "<!italic><#8fa0ae>Inutilisé"
        slot: 0
        description: []
      owned-companions:
        type: CHEST
        amount: 1
        name: "<!italic><#8fa0ae>Inutilisé"
        slot: 4
        description: []
      upgrade-abilities:
        type: PAPER
        amount: 1
        name: "<!italic><#8fa0ae>Inutilisé"
        slot: 8
        description: []

  # INUTILISE : boutique supprimee. Cles conservees, meme raison.
  open-companions-shop:
    title: "<!italic><#1f3a52><b>Inutilisé</b>"
    size: 54
    openSound: BLOCK_AMETHYST_BLOCK_CHIME
    goBackCommand: "companions"

  # Collection : les compagnons remplissent le centre du cadre, 28 par page.
  owned-companions:
    title: "<!italic><#1f3a52><b>Vos compagnons</b>"
    size: 54
    openSound: BLOCK_AMETHYST_BLOCK_CHIME
    goBackCommand: "companions"
    items:
      companionDetails:
        type: SOUL_LANTERN
        amount: 1
        name: "<!italic><#5fd3ff><b>Compagnon actif</b>"
        slot: 4
        description:
          - "<!italic><#e3eaf0>%active_companion_l%"
          - "<!italic> "
          - "<!italic><#ff8a8a>Clic gauche <#8fa0ae>· le renvoyer"

  # Atelier : fiche du compagnon en haut, quatre actions au centre, retour en bas.
  upgrade-abilities:
    title: "<!italic><#1f3a52><b>Atelier</b>"
    size: 27
    openSound: BLOCK_AMETHYST_BLOCK_CHIME
    goBackCommand: "companions"
    items:
      # Remplacee par la tete du compagnon actif ; le nom ci-dessous ne sert que sans compagnon.
      upgradeDetails:
        type: BOOK
        amount: 1
        name: "<!italic><#5fd3ff><b>Fiche du compagnon</b>"
        slot: 4
        description:
          - "<!italic><#8fa0ae>Nom <#e3eaf0>%companion_name%"
          - "<!italic><#8fa0ae>Niveau <#e3eaf0>%companion_level%"
      abilityLevel:
        type: EXPERIENCE_BOTTLE
        amount: 1
        maxedName: "<!italic><#6ee7b7><b>Capacité au maximum</b>"
        name: "<!italic><#5fd3ff><b>Niveau de capacité</b>"
        slot: 10
        price: 200000
        description:
          - "<!italic><#5fd3ff>Clic gauche <#8fa0ae>· +1 niveau"
          - "<!italic><#ff8a8a>Clic droit <#8fa0ae>· −1 niveau"
          - "<!italic> "
          - "<!italic><#8fa0ae>Coût <#e3eaf0>200 000 $"
        maxedDescription:
          - "<!italic><#8fa0ae>Niveau maximum atteint."
          - "<!italic> "
          - "<!italic><#ff8a8a>Clic droit <#8fa0ae>· −1 niveau"
      renameCompanion:
        type: NAME_TAG
        amount: 1
        name: "<!italic><#5fd3ff><b>Renommer</b>"
        slot: 12
        price: 10000
        description:
          - "<!italic><#5fd3ff>Clic gauche <#8fa0ae>· choisir un nom"
          - "<!italic> "
          - "<!italic><#8fa0ae>Coût <#e3eaf0>10 000 $"
      hideCompanionName:
        type: GRAY_DYE
        amount: 1
        name: "<!italic><#5fd3ff><b>Masquer le nom</b>"
        slot: 14
        price: 1000
        description:
          - "<!italic><#5fd3ff>Clic gauche <#8fa0ae>· basculer"
          - "<!italic> "
          - "<!italic><#8fa0ae>Coût <#e3eaf0>1 000 $"
      changeWeapon:
        type: IRON_SWORD
        amount: 1
        name: "<!italic><#5fd3ff><b>Changer l'arme</b>"
        slot: 16
        price: 60000000
        description:
          - "<!italic><#5fd3ff>Clic gauche <#8fa0ae>· équiper"
          - "<!italic> "
          - "<!italic><#8fa0ae>Coût <#e3eaf0>60 000 000 $"
      goBack:
        type: SPECTRAL_ARROW
        amount: 1
        name: "<!italic><#5fd3ff><b>Retour à la collection</b>"
        slot: 18
        description: []

  player-details:
    title: "<!italic><#1f3a52><b>Compagnon de %target_l%</b>"
    openSound: BLOCK_AMETHYST_BLOCK_CHIME
    items:
      companionDetails:
        description:
          - "<!italic><#e3eaf0>%active_companion_l%"
