  helpMessage:
    - ""
    - "<gold>Companions Renewed <gray>by Chronic Reflexes"
    - ""
    - "<gold>Aliases:<yellow> /c, /givec, /removec, /givecitem, /coin, /cc"
    - ""
    - "<yellow>➩ <gold>/companions <yellow> - opens up the companions main GUI." 
    - "<yellow>➩ <gold>/companions shop <yellow>- opens the Companions Shop Menu." 
    - "<yellow>➩ <gold>/companions owned <yellow>- opens the Companions Owned Menu." 
    - "<yellow>➩ <gold>/companions upgrade <yellow>- opens the Companions Upgrades Menu."     
    - "ADMIN:<yellow>➩ <gold>/companions upgrade <upgradename> <yellow>- directly purchase an upgrade without entering the menu."     
    - "ADMIN:<yellow>➩ <gold>/companions toggle - toggles your active Companion back/away."      
    - "<yellow>➩ <gold>/companions details <player> <yellow>- checks the Companion details of the specified online player."
    - "<yellow>➩ <gold>/tradecompanion <player> <companion> <yellow>- trades the specified Companion to the specified player."
    - "ADMIN:<yellow>➩ <gold>/givecompanion <player> <companion> (true) <yellow>- Gives the specified player the specified Companion. Setting true makes it so it gives it as an active"     
    - "<yellow>➩ <gold>/companioncoin <yellow>- Shows you your total Companion Coin(s)."     
    - "ADMIN:<yellow>➩ <gold>/removecompanion <player> <companion> <yellow>- Removes the specified Companion from the specified Player."
    - "ADMIN:<yellow>➩ <gold>/givecompanionitem <player> <item> <amount> <yellow>- Gives the player the specified plugin item."   
    - "ADMIN:<yellow>➩ <gold>/forceactive <player> <companion> <yellow>- forces an owned Companion onto the specified player."
    - "ADMIN:<yellow>➩ <gold>/forcedeactive <player><yellow> - forces the specified player's active Companion to be removed."    
    - "ADMIN:<yellow>➩ <gold>/forceupgrade <player> <upgrade> <yellow>- forces an upgrade upon specified player. (does not make player pay the upgrade fee)." 
    - "ADMIN:<yellow>➩ <gold>/companions reload <yellow>- Reloads the Companions Renewed Plugin."     
    - ""