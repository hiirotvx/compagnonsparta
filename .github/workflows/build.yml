name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Construire MSLands et l'installer en local
        run: |
          set -e
          git clone --quiet https://github.com/IbanEtchep/MSLands.git /tmp/mslands
          cd /tmp/mslands
          git checkout --quiet a3f18bd96e399376614a62dee5e0cb59ddf490c7
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon --quiet

      - name: Aligner la version de paper-api
        run: python3 .github/scripts/pick_paper_version.py

      - name: Compiler le plugin
        run: mvn -B -ntp clean package

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: companions-renewed
          path: target/companions-renewed-*.jar
          if-no-files-found: error
