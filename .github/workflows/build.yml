name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Attendre que JitPack publie MSLands 1.1.1
        run: |
          set -u
          URL="https://jitpack.io/com/github/IbanEtchep/MSLands/1.1.1/MSLands-1.1.1.pom"
          for i in $(seq 1 25); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            echo "tentative $i : HTTP $code"
            if [ "$code" = "200" ]; then
              echo "MSLands 1.1.1 disponible"
              exit 0
            fi
            sleep 20
          done
          echo "JitPack n'a pas publie MSLands 1.1.1 dans le temps imparti"
          exit 1

      - name: Aligner la version de paper-api
        run: python3 .github/scripts/pick_paper_version.py

      - name: Compiler le plugin
        run: mvn -B -ntp clean package

      - name: Publier le JAR
        uses: actions/upload-artifact@v4
        with:
          name: companions-renewed
          path: target/companions-renewed-*.jar
          if-no-files-found: error
